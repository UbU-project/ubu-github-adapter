[package]
name = "ubu_github_adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GitHub adapter for UbU Phase 1."
repository = "https://github.com/UbU-project/ubu-github-adapter"

[dependencies]
octocrab = "0.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "c77c0a2d1c3e206b8c18c023bb8b4ee0d06eb2d0" }

[dev-dependencies]
tempfile = "3.10"
